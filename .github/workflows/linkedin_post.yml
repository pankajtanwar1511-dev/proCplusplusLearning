name: LinkedIn post

# Posts the next carousel of the LinkedIn series (linkedin_tasks/series.json),
# records it in linkedin_tasks/posted.json and pushes that to main, so the app's
# LinkedIn Posts page shows it as posted with time and link.
# Setup and controls: linkedin_tasks/bot/README.md

on:
  # Only trigger: cron-job.org starts this at 11:30 and 23:00 JST with mode "scheduled"
  # (GitHub's own cron started runs hours late, so it is not used). Manual runs: Run workflow.
  workflow_dispatch:
    inputs:
      mode:
        description: 'post = post now; dry-run = check token + preview, change nothing; status = print series status; comment = add missing first comments; scheduled = slot run (used by cron-job.org)'
        type: choice
        options: [dry-run, post, status, comment, scheduled]
        default: dry-run
      post_id:
        description: 'Optional: post this id instead of the next one (e.g. T02-P2)'
        required: false
        default: ''
      force:
        description: 'Ignore the minimum gap / start date (manual catch-up)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Latest main, not the commit at trigger time: a run that waited in
          # GitHub's queue must see posted.json as pushed by the run before it,
          # or it could post the same item twice.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Hold check (scheduled runs only)
        # An open "LinkedIn bot on hold" issue stops scheduled posting until a human
        # closes it (opened when a post may or may not be live, see the last step).
        id: hold
        if: inputs.mode == 'scheduled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --state open --limit 200 --json title -q '.[].title' | grep -Fxq "LinkedIn bot on hold"; then
            echo "on_hold=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Bot is on hold (open issue 'LinkedIn bot on hold'). Not posting."
          fi

      - name: Run bot
        id: bot
        if: steps.hold.outputs.on_hold != 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_USER_ID: ${{ secrets.LINKEDIN_USER_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ inputs.mode || 'post' }}
          POST_ID: ${{ inputs.post_id }}
          FORCE: ${{ inputs.force }}
        run: |
          cd linkedin_tasks/bot
          args=""
          case "$MODE" in
            dry-run) args="--dry-run" ;;
            status)  args="--status" ;;
            comment) args="--comment-missing" ;;
            scheduled) args="--scheduled" ;;
          esac
          [ -n "$POST_ID" ] && args="$args --id $POST_ID"
          [ "$FORCE" = "true" ] && args="$args --force"
          python3 post_next.py $args

      - name: Commit posted.json
        id: commit
        # always(): even if the bot failed after posting, the record must be saved
        # or the next run could post the same item again.
        if: always()
        run: |
          if git diff --quiet -- linkedin_tasks/posted.json; then echo "Nothing posted"; exit 0; fi
          git config user.name "linkedin-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin_tasks/posted.json
          git commit -m "chore(linkedin): posted ${{ steps.bot.outputs.posted_id || 'update' }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Could not push posted.json. The post IS live; add it to posted.json manually." && exit 1

      - name: Put the bot on hold if a post may be duplicated
        # Case 1: LinkedIn timed out / 5xx while creating the post (it may be live).
        # Case 2: the post is live but posted.json could not be pushed (a retry would re-post).
        if: always() && (steps.bot.outputs.hold != '' || (steps.bot.outputs.posted_id != '' && steps.commit.outcome == 'failure'))
        env:
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ steps.bot.outputs.hold || format('{0} is live but posted.json could not be pushed', steps.bot.outputs.posted_id) }}
        run: |
          if ! gh issue list --state open --limit 200 --json title -q '.[].title' | grep -Fxq "LinkedIn bot on hold"; then
            gh issue create --title "LinkedIn bot on hold" --body "Scheduled posting is paused to avoid a duplicate post.

          Reason: $WHY
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To fix: check your LinkedIn profile.
          - If the post IS live: make sure its id is in linkedin_tasks/posted.json (add post_urn/url if known).
          - If it is NOT live: remove its entry from linkedin_tasks/posted.json (or post it with Run workflow, mode post, post_id).
          Then close this issue and posting resumes at the next slot."
          fi
          echo "::error::Bot put on hold: $WHY"

      - name: Warn if the first comment failed
        if: steps.bot.outputs.comment_ok == 'false'
        run: echo "::warning::Post ${{ steps.bot.outputs.posted_id }} is live but the first comment failed. Add it by hand."

      - name: Reminder issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOW: ${{ steps.bot.outputs.low_buffer }}
          DAYS: ${{ steps.bot.outputs.days_left }}
          TOKEN_WARN: ${{ steps.bot.outputs.token_warning }}
          TOKEN_ERR: ${{ steps.bot.outputs.token_error }}
        run: |
          open_issue() {  # title, body: create once, never duplicate an open issue
            if [ -z "$(gh issue list --state open --search "in:title \"$1\"" --json number -q '.[].number')" ]; then
              gh issue create --title "$1" --body "$2"
            fi
          }
          if [ "$LOW" = "true" ]; then
            open_issue "LinkedIn queue running low" "Only $DAYS day(s) of posts left. Build the next chapter and add it to linkedin_tasks/series.json."
          fi
          if [ -n "$TOKEN_WARN" ]; then
            open_issue "LinkedIn token expiring soon" "$TOKEN_WARN. Renew it (linkedin_tasks/bot/README.md), update the LINKEDIN_ACCESS_TOKEN secret and token_expires_on in series.json."
          fi
          if [ "$TOKEN_ERR" = "true" ]; then
            open_issue "LinkedIn token invalid or expired" "The bot could not authenticate. Renew the token (linkedin_tasks/bot/README.md) and update the LINKEDIN_ACCESS_TOKEN secret. Posting is stopped until then."
          fi
